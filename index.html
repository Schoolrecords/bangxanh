<!-- Biểu tượng PowerPoint (nhiều màu, không lấy theo màu chữ như các icon nét).
     Ẩn bằng width/height 0 chứ KHÔNG dùng display:none — với display:none

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">

      <stop offset="0" stop-color="#F5883A"/><stop offset="1" stop-color="#FFCE7D"/>
    </linearGradient>
    <linearGradient id="ppt-o" x1="1" y1="28" x2="14" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A81325"/><stop offset="1" stop-color="#D82A3E"/>
    </linearGradient>
  </defs>
  <symbol id="f-ppt" viewBox="0 0 32 32">

    <rect x=".8" y="14.2" width="13.6" height="13.6" rx="3.2" fill="url(#ppt-o)"/>

</svg>
